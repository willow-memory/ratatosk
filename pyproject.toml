[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ratatosk-meaning"
version = "1.1.0"
description = "Willow platform session runtime — MCP client, capability gate, tier-0 sync"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sean Campbell" }]
keywords = ["willow", "mcp", "agent", "session", "local-first"]
dependencies = []

[project.optional-dependencies]
cloud = ["anthropic>=0.40"]
mcp = ["mcp>=1.0,<3"]
local = ["requests>=2.31"]
dev = ["pytest>=8", "ratatosk-meaning[cloud,mcp,local]"]

[project.scripts]
ratatosk = "ratatosk.crown:main"

[tool.hatch.build.targets.wheel]
packages = ["ratatosk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
